name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: make ci (in the devcontainer)
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: make ci

