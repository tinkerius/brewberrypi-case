name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: make ci (in the devcontainer)
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: make ci

      - name: Upload STLs and previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stl
          path: 04-stl/
