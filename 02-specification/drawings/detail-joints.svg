c0" stroke-width="0.25" marker-start="url(#a)" marker-end="url(#a)"/><text x="156.80" y="112.50" font-size="3.2" fill="#1565c0" text-anchor="middle" font-weight="normal" font-family="Helvetica, Arial, sans-serif" transform="rotate(-90 156.80 112.50)">3</text><text x="6" y="162.00" font-size="3" fill="#666" font-family="Helvetica, Arial, sans-serif">Both: the lids cannot slide or twist. The 4 M3 screws per lid only clamp. Pry notch (F16) in the back rim to lift the top lid.</text><text x="6" y="157.50" font-size="3" fill="#666" font-family="Helvetica, Arial, sans-serif">Y: the bottom lid's 2 × 4 mm lip reaches inside the walls with 0.2 per side (skipping the corner columns). Lid edges flush with the body.</text><text x="6" y="153.00" font-size="3" fill="#666" font-family="Helvetica, Arial, sans-serif">X: the outer 1.5 mm of the wall rises 3 mm above the lid seat (rim). The top lid drops in with 0.2 per side, sits on the 1.5 mm seat + column tops and is flush with the rim.</text></svg>
